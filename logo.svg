<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Shimmer gradient for animation -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E86FF">
        <animate attributeName="stop-color" values="#6E86FF;#7B5BE0;#6E86FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A7B8FF">
        <animate attributeName="stop-color" values="#A7B8FF;#6E86FF;#A7B8FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6E86FF">
        <animate attributeName="stop-color" values="#6E86FF;#7B5BE0;#6E86FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmer sweep -->
    <linearGradient id="sweep" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animate attributeName="x1" values="-100%;200%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- V monogram -->
  <g filter="url(#glow)">
    <!-- Main V shape -->
    <path
      d="M9 9 L20 31 L31 9"
      stroke="url(#shimmer)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Secondary arc for depth -->
    <path
      d="M13 11 L20 25 L27 11"
      stroke="url(#shimmer)"
      stroke-width="1"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.4"
      fill="none"
    />
  </g>

  <!-- Shimmer overlay -->
  <path
    d="M9 9 L20 31 L31 9"
    stroke="url(#sweep)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.5"
  />

  <!-- Small spark dots -->
  <circle cx="9" cy="9" r="1.2" fill="#A7B8FF" opacity="0.9"/>
  <circle cx="31" cy="9" r="1.2" fill="#A7B8FF" opacity="0.9"/>
</svg>
